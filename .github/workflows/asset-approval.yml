name: Asset Approval Workflow

on:
  pull_request:
    types: [opened, synchronize, reopened]
  pull_request_review:
    types: [submitted]

permissions:
  pull-requests: write
  contents: write

jobs:
  validate-submission:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Validate Asset Request
        run: |
          echo "✓ Asset submission validated"
          echo "Status: PENDING APPROVAL"
          echo "Submitted by: ${{ github.actor }}"

  check-approval:
    needs: validate-submission
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request_review' && github.event.review.state == 'approved'
    steps:
      - uses: actions/checkout@v3
      
      - name: Process Approved Asset
        run: |
          echo "✓ APPROVED by ${{ github.event.review.user.login }}"
          echo "Status: EXECUTING"
          
      - name: Execute Asset Allocation
        run: |
          echo "✓ Asset allocation executed successfully"
          echo "Timestamp: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "PR: ${{ github.event.pull_request.number }}"
          
  log-decision:
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@v3
      
      - name: Log Decision
        run: |
          echo "=== ASSET APPROVAL LOG ==="
          echo "Workflow: Asset Approval System"
          echo "Triggered by: ${{ github.actor }}"
          echo "Action: ${{ github.event.action }}"
          echo "Result: Logged"
          echo "Timestamp: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
